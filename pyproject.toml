[project]
name = "ragvance"
version = "0.1.0"
description = "AI Study Assistant with RAG"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0,<6.0",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.3",
    "langchain-google-genai>=4.3.2",
    "langchain-text-splitters>=1.1.2",
    "faiss-cpu>=1.15.0",
    "sentence-transformers>=5.7.0",
    "pymupdf>=1.28.2",
    "pypdf>=6.15.0",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "python-dotenv>=1.0",
    "numpy>=2.5.1",
    "pandas>=2.0",
    "gunicorn>=23.0",
    "whitenoise>=6.8",
    "dj-database-url>=2.5",
    "psycopg[binary]>=3.2",
    "requests>=2.32",
    "onnxruntime>=1.30",
    "onnx>=1.23",
    "onnxscript>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = ["pytest", "pytest-django"]