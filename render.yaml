services:
  - type: web
    name: ragvance
    runtime: python
    plan: free
    healthCheckPath: /
    buildCommand: >-
      grep -vE '^(nvidia|triton|cuda-)' requirements.txt > /tmp/requirements.render.txt
      && pip install --no-cache-dir torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
      && pip install --no-cache-dir -r /tmp/requirements.render.txt
      && python manage.py collectstatic --noinput
      && HF_HOME=/opt/render/project/src/.hf_cache HF_HUB_OFFLINE=0 python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2')"
      && python -c "import os,glob,sys; base='/opt/render/project/src/.hf_cache/hub/models--sentence-transformers--all-MiniLM-L6-v2/snapshots'; snaps=sorted(glob.glob(base+'/*')); core=['config.json','modules.json','sentence_bert_config.json','tokenizer_config.json','vocab.txt','1_Pooling/config.json']; wts=['model.safetensors','pytorch_model.bin']; good=[s for s in snaps if all(os.path.isfile(os.path.join(s,f)) for f in core) and any(os.path.isfile(os.path.join(s,w)) and os.path.getsize(os.path.join(s,w))>=80000000 for w in wts)]; print('HF cache integrity OK: '+good[0]) if good else sys.exit('FATAL: Hugging Face cache verification failed - complete all-MiniLM-L6-v2 snapshot with >=80MB weights not found under '+base)"
      && HF_HOME=/opt/render/project/src/.hf_cache python scripts/export_onnx.py
      && pip uninstall -y sentence-transformers torch
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 180
    envVars:
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: ragvance-document
      - key: GEMINI_API_KEY
        sync: false
      - key: HF_HOME
        value: /opt/render/project/src/.hf_cache
      - key: HF_HUB_OFFLINE
        value: "1"
      - key: EMBEDDING_BACKEND
        value: "onnx"
